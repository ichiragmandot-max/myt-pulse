<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Feedback Dashboard · Mayank Tutorials</title>
<link rel="icon" href="/favicon.png">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Lora:wght@600;700&display=swap" rel="stylesheet">
<script src="/vendor/xlsx.full.min.js" defer></script>
<style>
:root{--navy:#203864;--navy-2:#3a5a96;--red:#DD152B;--ink:#16213a;--ink-2:#4a5672;--muted:#8a93a8;--line:#e3e7ef;--bg:#f4f6fa;--card:#fff;--soft:#eef2f9;--prev:#b8c0cf;--up:#14804a;--down:#c4182b}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Plus Jakarta Sans',system-ui,sans-serif;font-size:14px;line-height:1.45}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--navy)}
header{background:#fff;padding:0 20px;border-bottom:3px solid #0E8AC8;box-shadow:0 2px 10px rgba(22,33,58,.06);position:sticky;top:0;z-index:20}
header .in{max-width:1280px;margin:0 auto;display:flex;align-items:center;gap:18px;height:64px}
.brand{display:flex;align-items:center;gap:10px;white-space:nowrap}
.brand img{height:42px;width:auto}
.brand div{line-height:1.15}.brand b{display:block;font-family:Lora,Georgia,serif;color:var(--red);font-size:16px;letter-spacing:.3px}.brand small{color:var(--muted);font-size:12px;font-weight:600}
nav{display:flex;gap:4px;margin-left:10px;overflow-x:auto}
nav button{background:none;border:0;color:var(--ink-2);padding:8px 12px;border-radius:9px;font-weight:700;white-space:nowrap}
nav button:hover{background:var(--soft)}
nav button.on{background:var(--navy);color:#fff}
.chips{margin-left:auto;display:flex;gap:8px}
.chip{font-size:12px;font-weight:700;padding:5px 10px;border-radius:99px;background:#eef1f6;color:var(--ink-2);white-space:nowrap}
.chip.live{background:#e3f6ec;color:#14804a}.chip.off{background:#eef1f6;color:var(--muted)}
@media(max-width:860px){.chips{display:none}.brand div{display:none}}
main{max-width:1280px;margin:0 auto;padding:18px 20px 60px}
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px}
.filters select,.filters input{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 10px;min-width:150px}
.filters .note{color:var(--muted);font-size:12.5px;margin-left:auto}
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px}
.card h3{margin:0 0 2px;font-size:15px}
.card .sub{color:var(--muted);font-size:12.5px;margin-bottom:12px}
.kpi .lab{color:var(--ink-2);font-weight:600;font-size:12.5px}
.kpi .val{font-size:30px;font-weight:800;letter-spacing:-.5px;margin:4px 0 2px;font-variant-numeric:tabular-nums}
.kpi .val small{font-size:15px;color:var(--muted);font-weight:600}
.kpi .cmp{font-size:12.5px;color:var(--muted)}

.delta.up{color:var(--up)}.delta.down{color:var(--down)}.delta.flat{color:var(--muted)}
.two{grid-template-columns:1.4fr 1fr}

table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);font-weight:700;text-align:left;padding:8px 8px;border-bottom:1px solid var(--line);white-space:nowrap;user-select:none}
th.s{cursor:pointer}th.s:hover{color:var(--ink)}
th.num,td.num{text-align:right}
td{padding:8px 8px;border-bottom:1px solid #f0f2f6;vertical-align:middle}
tr.click{cursor:pointer}tr.click:hover td{background:#f8f9fc}
td.sc{text-align:center;font-weight:700;border-radius:6px;border:2px solid #fff;min-width:52px}
.tablewrap{overflow-x:auto}
.name{font-weight:700}
.dim{color:var(--muted)}
.rate{display:flex;align-items:center;gap:8px;min-width:140px}
.rate .track{flex:1;height:8px;background:#eef1f6;border-radius:4px;overflow:hidden}

.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);margin:4px 0 10px}

.sw{width:12px;height:12px;border-radius:3px;display:inline-block}
.days{display:flex;align-items:flex-end;gap:4px;height:160px;padding-top:10px;border-bottom:1px solid var(--line);position:relative}

.list .item{display:flex;gap:10px;align-items:center;padding:9px 0;border-top:1px solid #f0f2f6}

.btn{white-space:nowrap;border:0;background:var(--navy);color:#fff;border-radius:10px;padding:9px 14px;font-weight:700}

.drawer .hd{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--line);padding:16px 20px;display:flex;align-items:center;gap:14px;z-index:2}
.drawer .bd{padding:18px 20px;display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}

.drawer .kpis{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.x{margin-left:auto;background:none;border:1px solid var(--line);border-radius:10px;width:36px;height:36px;font-size:18px}
.avatar{width:46px;height:46px;border-radius:14px;background:var(--navy);color:#fff;font-weight:800;display:grid;place-items:center}
.avatar.staff{background:var(--red)}
.qbar{display:grid;grid-template-columns:190px 1fr 52px 64px;gap:10px;align-items:center;padding:7px 0}
.qbar .lb{font-weight:600;font-size:13px}
.qbar .bars{display:grid;gap:3px}
.qbar .bars div{height:10px;border-radius:0 5px 5px 0;background:var(--navy)}
.qbar .bars div.p{background:var(--prev);height:6px}
.qbar .v{font-weight:800;text-align:right}
@media(max-width:600px){.qbar{grid-template-columns:110px 1fr 40px 56px}}
.dist{display:flex;height:22px;border-radius:6px;overflow:hidden;gap:2px;background:#fff}
.dist i{display:block;height:100%}
.comments .c{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;display:flex;gap:10px;align-items:flex-start}
.comments .c.hid{opacity:.55;background:#fafafa}
.comments .c .t{flex:1;white-space:pre-wrap;word-break:break-word}
.comments .c .m{font-size:11.5px;color:var(--muted);margin-top:4px}
.summary{background:#fff;border:1px solid var(--line);border-left:4px solid var(--navy);border-radius:12px;padding:12px 14px;white-space:pre-wrap}
.tag{font-size:11px;font-weight:700;border-radius:99px;padding:2px 8px;background:var(--soft);color:var(--navy);white-space:nowrap}
.tag.red{background:#fde8ea;color:var(--red)}.tag.amber{background:#fff2d6;color:#8a5a00}
/* login */
.login{max-width:360px;margin:12vh auto;background:#fff;border:1px solid var(--line);border-radius:18px;padding:26px}
.login input{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 12px;margin:12px 0}
.err{color:var(--red);font-weight:600;font-size:13px}
.setup .row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:12px 0;border-top:1px solid #f0f2f6}
.setup .row:first-of-type{border-top:0}
.setup .row .txt{flex:1;min-width:240px}
.switch{position:relative;width:46px;height:26px;border-radius:99px;background:#cfd5e1;border:0;flex:0 0 auto;transition:background .15s}
.switch::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .15s}
.switch.on{background:#1f9d5c}.switch.on::after{left:23px}
.problems{color:var(--red);font-size:13px;margin-top:8px}
.tip{position:fixed;pointer-events:none;background:var(--ink);color:#fff;font-size:12px;padding:6px 9px;border-radius:8px;z-index:50;display:none;white-space:nowrap}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.logrow{border-top:1px solid #f0f2f6}
.logrow summary{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;padding:10px 4px;cursor:pointer;list-style:none}
.logrow summary::-webkit-details-marker{display:none}
.logrow summary:hover{background:#f8f9fc}
.logrow[open] summary{background:#f4f6fa}
.logrow .ref{font-variant-numeric:tabular-nums;color:var(--navy);min-width:52px}
.logbody{padding:10px 4px 14px}
.logrow.excl summary{opacity:.6}
.reasons{background:#fff6e5;border:1px solid #f3dfb2;border-radius:10px;padding:8px 12px;margin-bottom:10px;font-size:13.5px}
.reasons a,.signals a{color:var(--navy);font-weight:700}
.signals{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--ink-2);margin-bottom:10px}
.signals a{text-decoration:none;background:var(--soft);padding:2px 8px;border-radius:8px}
.tog{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--ink-2);cursor:pointer}
.filters .tog input{min-width:0;width:16px;height:16px;padding:0;margin:0;accent-color:var(--red)}
.integ{display:flex;align-items:center;gap:14px;justify-content:space-between;border-left:4px solid var(--red);margin-bottom:14px}
.att{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:800px){.att{grid-template-columns:1fr}}

<body>
<div id="root"></div>
<div class="scrim" id="scrim"></div><aside class="drawer" id="drawer"></aside>
<div class="tip" id="tip"></div><div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=v=>v==null||isNaN(v)?'–':v.toFixed(2);
const pct=v=>v==null?'–':Math.round(v*100)+'%';
const initials=n=>n.replace(/\b(sir|mam|maam|madam)\b/ig,'').trim().split(/\s+/).map(w=>w[0]).join('').slice(0,2).toUpperCase();
const LABELS={teacher:['Clarity','Doubt solving','Approachable','Knowledge','Punctuality'],staff:['Helpful','Beyond expectations','Communication','Timeliness','Resolves issues']};
const OVERALL_L=['Would recommend','Marks improved','Communication & support'];
let TOKEN=sessionStorage.getItem('pulse-admin');
let D=null, TAB=localStorage.getItem('pulse-tab')||'overview', F={centre:'',batch:'',q:''}, SORT={k:'overall',d:-1};
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2800)}
async function api(path,body){
  const r=await fetch('/api/admin/'+path,{method:body?'POST':'GET',headers:{'content-type':'application/json',authorization:'Bearer '+TOKEN},body:body?JSON.stringify(body):undefined});
  const d=await r.json().catch(()=>({}));
  if(r.status===401&&path!=='login'){sessionStorage.removeItem('pulse-admin');TOKEN=null;loginView();throw new Error('Logged out')}
  if(!r.ok){const e=new Error(d.error||'Error');e.data=d;throw e}
  return d;
}
function loginView(msg){
  $('#root').innerHTML=`<div class="login"><img src="/logo.jpg" alt="Mayank Tutorials" style="width:100%;height:auto"><p class="dim" style="text-align:center;margin:8px 0 0">Feedback dashboard · admin</p><form id="lf"><input type="password" id="pw" placeholder="Admin password" autofocus><button class="btn" style="width:100%">Log in</button><p class="err" id="le">${esc(msg||'')}</p></form></div>`;
  $('#lf').onsubmit=async e=>{e.preventDefault();try{const d=await api('login',{password:$('#pw').value});TOKEN=d.token;sessionStorage.setItem('pulse-admin',TOKEN);boot()}catch(err){$('#le').textContent=err.message}};
}

// ---------------- data model ----------------
function prep(d){
  const sc=d.subCols,rc=d.ratCols;
  const toObj=(cols,row)=>{const o={};cols.forEach((c,i)=>o[c]=row[i]);return o};
  d.S=d.subs.map(r=>toObj(sc,r)); d.R=d.rats.map(r=>toObj(rc,r));
  const canon=n=>d.aliases[n]||n;
  for(const r of d.R)r.p=canon(r.person);
  d.students={};for(const b of d.batches)d.students[b.centre+'|'+b.batch]=b.students||0;
  d.centres=[...new Set([...d.batches.map(b=>b.centre),...d.S.map(s=>s.centre)])];
  d.year0=d.year;
  d.bySid=new Map();for(const r of d.R){if(!d.bySid.has(r.sid))d.bySid.set(r.sid,[]);d.bySid.get(r.sid).push(r)}
  d.sum={};for(const s of d.summaries)d.sum[s.person+'|'+s.role]=s;
  d.subById=new Map(d.S.map(s=>[s.id,s]));
  computeSus(d);
  return d;
}
// ---- Fake-feedback detection: simple, explainable rules. Score >=5 = likely fake, >=2 = worth a look ----
function computeSus(d){
  const y=d.year0, S=d.S.filter(s=>s.year===y), sus=new Map();
  const add=(id,w,txt,q)=>{let x=sus.get(id);if(!x)sus.set(id,x={score:0,reasons:[]});x.score+=w;x.reasons.push({txt,q,w})};
  const group=(key)=>{const m=new Map();for(const s of S){const k=s[key];if(!k)continue;if(!m.has(k))m.set(k,[]);m.get(k).push(s)}return m};
  const t=s=>new Date(String(s.ts).replace(' ','T')).getTime();
  // 1. same phone, several responses
  for(const[k,g]of group('dev'))if(g.length>=2)for(const s of g)add(s.id,g.length>=3?4:2,`Same phone sent ${g.length} responses${g.length===2?' (could be siblings)':''}`,'dev:'+k);
  // 2. burst from one network: 5+ within 20 minutes
  for(const[k,g]of group('net')){if(g.length<5)continue;for(const s of g){const n=g.filter(o=>Math.abs(t(o)-t(s))<=20*60e3).length;if(n>=5)add(s.id,2,`${n} responses from the same network within 20 min`,'net:'+k)}}
  // per-batch teacher averages (for "far from classmates")
  const bt=new Map();
  for(const r of d.R){if(r.year!==y||r.role!=='teacher')continue;const v=mean([r.r1,r.r2,r.r3,r.r4,r.r5]);if(v==null)continue;const k=r.centre+'|'+r.batch+'|'+r.p;const x=bt.get(k)||{s:0,n:0};x.s+=v;x.n++;bt.set(k,x)}
  const teachersIn=new Map();for(const a of d.assignments)if(a.role==='teacher'){const k=a.centre+'|'+a.batch;if(!teachersIn.has(k))teachersIn.set(k,new Set());teachersIn.get(k).add(a.person)}
  const comments=new Map();const norm=c=>String(c).toLowerCase().replace(/[^a-z0-9\u0900-\u097f]/g,'');
  for(const s of S){
    const rs=d.bySid.get(s.id)||[];
    const vals=[s.q1,s.q2,s.q3,...rs.flatMap(r=>[r.r1,r.r2,r.r3,r.r4,r.r5])].filter(v=>v!=null), n=vals.length;
    // 3. too fast
    if(s.secs!=null&&n>=10){const per=s.secs/n;if(per<1)add(s.id,3,`Filled in ${s.secs}s for ${n} answers (too fast to read)`);else if(per<2)add(s.id,1,`Quick: ${s.secs}s for ${n} answers`)}
    // 4. every answer the same
    if(n>=10&&vals.every(v=>v===vals[0]))add(s.id,vals[0]===5?1:2,`All ${n} answers are ${vals[0]}`);
    // 5. rated only one teacher, extreme score
    const tr=rs.filter(r=>r.role==='teacher'&&[r.r1,r.r2,r.r3,r.r4,r.r5].some(v=>v!=null));
    const total=(teachersIn.get(s.centre+'|'+s.batch)||new Set()).size;
    if(total>=3&&tr.length===1){const v=mean([tr[0].r1,tr[0].r2,tr[0].r3,tr[0].r4,tr[0].r5]);if(v>=4.8||v<=1.5)add(s.id,3,`Rated only ${tr[0].p} (${v.toFixed(1)}) and no other teacher`,tr[0].p)}
    // 6. far from classmates
    let out=0;
    for(const r of tr){const v=mean([r.r1,r.r2,r.r3,r.r4,r.r5]);const x=bt.get(r.centre+'|'+r.batch+'|'+r.p);if(!x||x.n<6||out>=2)continue;const o=(x.s-v)/(x.n-1);if(Math.abs(v-o)>=2.5){out++;add(s.id,2,`${r.p}: gave ${v.toFixed(1)}, classmates average ${o.toFixed(1)}`,r.p)}}
    for(const c of [s.comment,...rs.map(r=>r.comment)]){if(!c)continue;const k=s.centre+'|'+norm(c);if(k.length-s.centre.length<36)continue;if(!comments.has(k))comments.set(k,new Set());comments.get(k).add(s.id)}
  }
  // 7. copy-pasted comments
  // (long, word-for-word identical comment at the same centre; counted once per response)
  const dup=new Map();for(const ids of comments.values())if(ids.size>=2)for(const id of ids){if(!dup.has(id))dup.set(id,new Set());for(const o of ids)if(o!==id)dup.get(id).add(o)}
  for(const[id,os]of dup)add(id,3,`Word-for-word same comment as ${[...os].slice(0,3).map(x=>'#'+x).join(', ')}${os.size>3?` and ${os.size-3} more`:''}`,'#'+[...os][0]);
  for(const x of sus.values())x.level=x.score>=5?'likely':x.score>=2?'review':'';
  d.sus=sus;
}
let HIDE_SUS=(()=>{try{return localStorage.getItem('pulse-hidesus')==='1'}catch{return false}})();
const susOf=s=>D.sus.get(s.id)||{score:0,reasons:[],level:''};
const keep=s=>!s.excluded&&!(HIDE_SUS&&s.year===D.year0&&susOf(s).level==='likely');
const keepSid=sid=>{const s=D.subById.get(sid);return !s||keep(s)};
const inF=x=>(!F.centre||x.centre===F.centre)&&(!F.batch||x.batch===F.batch);
const subs=y=>D.S.filter(s=>s.year===y&&inF(s)&&keep(s));
const allSubs=y=>D.S.filter(s=>s.year===y&&inF(s));
const rats=(y,role)=>D.R.filter(r=>r.year===y&&(!role||r.role===role)&&inF(r)&&keepSid(r.sid));
function mean(a){const v=a.filter(x=>x!=null);return v.length?v.reduce((p,c)=>p+c,0)/v.length:null}
function aggR(rows){ // 5 dims + overall
  const q=[1,2,3,4,5].map(i=>mean(rows.map(r=>r['r'+i])));
  return{n:rows.length,q,overall:mean(q)}
}
function people(role,y){
  const m=new Map();
  for(const r of rats(y,role)){if(!m.has(r.p))m.set(r.p,[]);m.get(r.p).push(r)}
  return m;
}
function deltaHTML(cur,prev,dec=2){
  if(cur==null||prev==null)return'<span class="delta flat">new</span>';
  const d=cur-prev; const cl=Math.abs(d)<0.05?'flat':d>0?'up':'down';
  return`<span class="delta ${cl}">${d>0?'▲':d<0?'▼':'■'} ${Math.abs(d).toFixed(dec)}</span>`;
}
// Diverging cell colour: red (below avg) – gray (avg) – navy (above). Text stays ink/white for contrast.
function cellStyle(v,mid){
  if(v==null)return'';
  const t=Math.max(-1,Math.min(1,(v-mid)/0.9));
  let bg,fg='#16213a';
  if(t>=0){const a=t;bg=`rgba(32,56,100,${0.08+a*0.82})`;if(a>0.55)fg='#fff'}
  else{const a=-t;bg=`rgba(221,21,43,${0.08+a*0.72})`;if(a>0.6)fg='#fff'}
  return`background:${bg};color:${fg}`;
}

// ---------------- shell ----------------
function shell(){
  const s=D.settings;
  const open=s.form_open==='1', rel=s.results_released==='1';

    ${k('Staff (avg)',fmt(sq.overall),`${deltaHTML(sq.overall,spp.overall)} vs ${fmt(spp.overall)} · ${sq.n.toLocaleString('en-IN')} ratings`)}
  </div>`;
  // responses per day + response rate by batch (who to chase)

  const brows=D.batches.filter(b=>b.active&&inF(b)).map(b=>{const n=sc.filter(s=>s.centre===b.centre&&s.batch===b.batch).length;return{...b,n,rate:b.students?n/b.students:null}}).sort((a,b)=>(a.rate??9)-(b.rate??9)||a.n-b.n);

  // centre table
  const cen=D.centres.filter(c=>!F.centre||c===F.centre).map(c=>{
    const f=x=>x.centre===c&&(!F.batch||x.batch===F.batch);
    const s=D.S.filter(x=>x.year===y&&f(x)), s0=D.S.filter(x=>x.year===p&&f(x));
    const st=Object.entries(D.students).filter(([k])=>k.startsWith(c+'|')&&(!F.batch||k.endsWith('|'+F.batch))).reduce((a,[,v])=>a+v,0);

// ---------------- people table ----------------
function peopleRows(role){
  const y=D.year,p=D.prev, cur=people(role,y), pr=people(role,p);
  const names=new Set([...cur.keys()]); if(!subs(y).length)for(const k of pr.keys())names.add(k);
  const rows=[];
  for(const n of names){
    const r=cur.get(n)||[],r0=pr.get(n)||[]; const a=aggR(r),b=aggR(r0);
    const centres=[...new Set(r.concat(r.length?[]:r0).map(x=>x.centre))];
    const subjects=[...new Set(r.concat(r.length?[]:r0).flatMap(x=>(x.subjects||'').split(', ')).filter(Boolean))];
    rows.push({n,centres,subjects,cnt:a.n,q:a.q,overall:a.overall,prev:b.overall,cnt0:b.n,delta:a.overall!=null&&b.overall!=null?a.overall-b.overall:null,comments:r.filter(x=>x.comment).length});
  }
  const q=F.q.trim().toLowerCase();
  return rows.filter(r=>!q||r.n.toLowerCase().includes(q)||r.subjects.join(' ').toLowerCase().includes(q));
}

    ${rows.map(r=>`<tr class="click" data-person="${esc(r.n)}" data-role="${role}"><td><div class="name">${esc(r.n)}</div><div class="dim" style="font-size:12px">${esc(r.subjects.slice(0,3).join(', '))}</div></td><td class="dim" style="font-size:12.5px">${esc(r.centres.join(', '))}</td><td class="num">${r.cnt||'–'}</td>

function readRoster(file){
  return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>{try{
    const wb=XLSX.read(fr.result,{type:'array'});
    const sheet=n=>{const k=wb.SheetNames.find(x=>x.toLowerCase().includes(n));if(!k)throw new Error(`Sheet "${n}" not found`);return XLSX.utils.sheet_to_json(wb.Sheets[k],{defval:''})};
    const tidy=v=>String(v??'').replace(/\s+/g,' ').trim();
    const col=(row,...keys)=>{for(const k of Object.keys(row)){const l=k.toLowerCase();if(keys.some(x=>l.includes(x)))return tidy(row[k])}return''};
    const batches=sheet('batch').map(r=>({centre:col(r,'centre','center'),batch:col(r,'batch'),students:parseInt(col(r,'students'))||null,active:!/^n/i.test(col(r,'yes/no','active ('))})).filter(r=>r.centre&&r.batch);
    const people=sheet('people').map(r=>({name:col(r,'name'),type:col(r,'type'),phone:col(r,'phone'),pin:col(r,'pin'),aliases:col(r,'2025').split(',').map(x=>x.trim()).filter(Boolean)}));
    // the "2025 names" column also contains "name" – read it explicitly
    sheet('people').forEach((r,i)=>{const k=Object.keys(r).find(k=>/^name$/i.test(k.trim()));if(k)people[i].name=tidy(r[k])});
    const teachers=sheet('teacher').map(r=>({centre:col(r,'centre','center'),batch:col(r,'batch'),subject:col(r,'subject'),person:col(r,'teacher')})).filter(r=>r.centre&&r.batch&&r.person);
    const staff=sheet('staff').map(r=>({centre:col(r,'centre','center'),batch:col(r,'batch')||'All',person:col(r,'staff')})).filter(r=>r.centre&&r.person);
    // Match names forgivingly: ignore capitals, extra spaces, Mam / Maam / Ma'am / Madam, dots
    const key=n=>String(n).toLowerCase().replace(/\bma['’]?a?m\b|\bmadam\b/g,'mam').replace(/[^a-z0-9]/g,'');
    const P=people.filter(p=>p.name), byKey=new Map(), dupes=[];
    for(const p of P){const k=key(p.name);if(byKey.has(k))dupes.push(p.name);else byKey.set(k,p.name)}
    const unknown=new Set();
    for(const r of [...teachers,...staff]){const m=byKey.get(key(r.person));if(m)r.person=m;else unknown.add(r.person)}
    const bset=new Set(batches.map(b=>b.centre+'|'+b.batch));
    const noBatch=new Set();
    for(const t of teachers)if(!bset.has(t.centre+'|'+t.batch))noBatch.add(t.centre+' · '+t.batch);
    for(const s of staff)if(s.batch!=='All'&&!bset.has(s.centre+'|'+s.batch))noBatch.add(s.centre+' · '+s.batch);
    const errors=[...[...new Set(dupes)].map(n=>`People sheet: "${n}" appears more than once. Give each person a different name (e.g. add a surname).`),...[...unknown].map(n=>`"${n}" is used on the Teachers/Staff sheet but is not on the People sheet. Add them to People.`)];
    const warnings=[...noBatch].map(b=>`${b} has teachers/staff but is not on the Batches sheet, so students can't pick it.`);
    res({batches,people:P,teachers,staff,errors,warnings});
  }catch(e){rej(e)}};fr.readAsArrayBuffer(file)});
}

  const er=$('#erase');if(er)er.onclick=async()=>{if(!confirm('Erase all phone and network tags for this year? Do this only after you have finished checking for fake feedback.'))return;try{await api('erase-signals',{});toast('Phone and network tags erased');boot()}catch(e){toast(e.message)}};
  v.querySelectorAll('[data-del]').forEach(b=>b.onclick=async e=>{e.preventDefault();const id=+b.dataset.del;if(!confirm(`Permanently delete response #${id} and all its ratings? This cannot be undone.`))return;
    try{await api('delete',{id});D.S=D.S.filter(s=>s.id!==id);D.R=D.R.filter(r=>r.sid!==id);D.bySid.delete(id);toast(`Response #${id} deleted`);draw()}catch(err){toast(err.message)}});
  const mo=$('#more');if(mo)mo.onclick=()=>{LOG_N+=100;draw()};
  const codeCall=async body=>{try{const r=await api('codes',body);D.codes=r.codes;draw()}catch(e){toast(e.message)}};
  v.querySelectorAll('[data-codes]').forEach(b=>b.onclick=()=>{if(b.dataset.codes==='off'&&!confirm('Turn codes off? Anyone with the link will be able to submit.'))return;codeCall({action:b.dataset.codes})});
  v.querySelectorAll('[data-coderegen]').forEach(b=>b.onclick=()=>{if(confirm(`Make a new code for ${b.dataset.coderegen}? The old code and links will stop working.`))codeCall({action:'regen',centre:b.dataset.coderegen})});
  v.querySelectorAll('[data-codeset]').forEach(b=>b.onclick=()=>{const x=prompt(`New code for ${b.dataset.codeset} (letters/numbers, 4+ characters):`,(D.codes||{})[b.dataset.codeset]||'');if(x)codeCall({action:'set',centre:b.dataset.codeset,code:x})});
  v.querySelectorAll('[data-codemsg]').forEach(b=>b.onclick=async()=>{const m=launchMsg(b.dataset.codemsg);try{await navigator.clipboard.writeText(m);toast('Message copied. Paste it in the '+b.dataset.codemsg+' WhatsApp groups.')}catch{prompt('Copy this message:',m)}});
  const sy=$('#saveyr');if(sy)sy.onclick=async()=>{try{await api('settings',{key:'year',value:$('#yr').value});boot()}catch(e){toast(e.message)}};
  const xf=$('#xf');if(xf)xf.onchange=async()=>{
    const box=$('#xprev');box.innerHTML='<div class="dim">Reading…</div>';
    try{const R=await readRoster(xf.files[0]);
      box.innerHTML=`<div class="row"><div class="txt">Found <b>${R.batches.length}</b> batches, <b>${R.people.length}</b> people, <b>${R.teachers.length}</b> teacher rows, <b>${R.staff.length}</b> staff rows.${R.errors.length?`<div class="problems"><b>Fix these in the Excel file, then upload again:</b><br>${R.errors.map(esc).join('<br>')}</div>`:''}${R.warnings.length?`<div style="color:#8a5a00;font-size:13px;margin-top:8px"><b>Check:</b><br>${R.warnings.map(esc).join('<br>')}</div>`:''}</div>${R.errors.length?'':'<button class="btn sm red" id="xgo">Replace roster</button>'}</div><div class="problems" id="xprob"></div>`;
      if(R.errors.length)return;
      $('#xgo').onclick=async()=>{$('#xgo').disabled=true;try{const r=await api('roster',{batches:R.batches,people:R.people,teachers:R.teachers,staff:R.staff});toast('Roster updated');boot()}catch(e){$('#xgo').disabled=false;$('#xprob').innerHTML=esc(e.message)+(e.data&&e.data.problems?'<br>'+e.data.problems.map(esc).join('<br>'):'')}};
    }catch(e){box.innerHTML=`<div class="problems">${esc(e.message)}</div>`}};
  const pb=$('#pins');if(pb)pb.onclick=async()=>{const r=await api('pins');const link=location.origin+'/me';download('MYT_Pulse_PINs.csv',csv([['Name','Type','Phone','PIN','Link','SMS message'],...r.people.map(p=>[p.name,p.type,p.phone,p.pin,link+'#'+p.pin,`Dear ${p.name}, your ${D.year} feedback from students & parents is ready. Open ${link}#${p.pin} (PIN ${p.pin}). Please keep this private. - Mayank Tutorials`])]))};
  const ga=$('#genall');if(ga)ga.onclick=async()=>{ga.disabled=true;const todo=[];for(const role of['teacher','staff'])for(const[n,rows]of people(role,D.year))if(rows.filter(r=>r.comment&&r.comment.trim().length>3).length>=3)todo.push([n,role]);
    let i=0,ok=0;for(const[n,role]of todo){i++;$('#genprog').textContent=`${i}/${todo.length}: ${n}`;try{const r=await api('summarize',{person:n,role});if(r.ok){ok++;D.sum[n+'|'+role]={text:r.text,updated:'just now'}}}catch(e){toast(n+': '+e.message)}}
    $('#genprog').textContent=`Done: ${ok} summaries written.`;ga.disabled=false};
  const ex=$('#exp');if(ex)ex.onclick=()=>{const y=D.year;const rows=[['Timestamp','Center','Batch','Role','Name','Subjects','Q1','Q2','Q3','Q4','Q5','Comment','Hidden']];const sm=new Map(D.S.map(s=>[s.id,s]));for(const r of D.R.filter(r=>r.year===y))rows.push([sm.get(r.sid)?.ts,r.centre,r.batch,r.role,r.p,r.subjects,r.r1,r.r2,r.r3,r.r4,r.r5,r.comment,r.hidden?'yes':'']);
    rows.push([]);rows.push(['Overall responses']);rows.push(['Timestamp','Center','Batch','Recommend','Improved','Service','Comment']);for(const s of D.S.filter(s=>s.year===y))rows.push([s.ts,s.centre,s.batch,s.q1,s.q2,s.q3,s.comment]);
    download(`MYT_Pulse_${y}_responses.csv`,csv(rows))};
}
// tooltip for any [data-tip]
document.addEventListener('mousemove',e=>{const t=e.target.closest&&e.target.closest('[data-tip]'),tip=$('#tip');if(!t){tip.style.display='none';return}tip.textContent=t.dataset.tip;tip.style.display='block';tip.style.left=Math.min(e.clientX+12,innerWidth-tip.offsetWidth-8)+'px';tip.style.top=(e.clientY+14)+'px'});

async function boot(){
  if(!TOKEN)return loginView();
  $('#root').innerHTML='<div class="empty" style="padding:80px">Loading dashboard…</div>';
  try{
    const meta=await api('data');
    const msg=t=>{const el=$('#root .empty');if(el)el.textContent=t};
    // Fetch rows in pages of 4,000 (keeps each request inside Cloudflare's free CPU limit)
    const all=async(t,y)=>{let out=[],after=0;for(;;){const r=await api(`rows?t=${t}&year=${y}&after=${after}`);out=out.concat(r.rows);msg(`Loading ${y} ${t==='subs'?'responses':'ratings'}… ${out.length.toLocaleString('en-IN')}`);if(r.next==null)return out;after=r.next}};
    // Last year's data doesn't change, so keep it for this browser session (saves Cloudflare reads)
    const pk='pulse-prev-'+meta.prev;let prev=null;try{prev=JSON.parse(sessionStorage.getItem(pk)||'null')}catch{}
    if(!prev){prev={subs:await all('subs',meta.prev),rats:await all('rats',meta.prev)};try{sessionStorage.setItem(pk,JSON.stringify(prev))}catch{}}
    const cs=await all('subs',meta.year), cr=await all('rats',meta.year);
    D=prep({...meta,subs:prev.subs.concat(cs),rats:prev.rats.concat(cr)});shell();
  }catch(e){if(TOKEN)$('#root').innerHTML=`<div class="empty">${esc(e.message)}</div>`}
}
boot();
</script>
