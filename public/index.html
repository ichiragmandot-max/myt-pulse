<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Annual Feedback · Mayank Tutorials</title>
<link rel="icon" href="/favicon.png">
<meta name="description" content="Share anonymous feedback about your teachers and staff. Takes 5 minutes. For Mayank Tutorials students and parents only.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Mayank Tutorials">
<meta property="og:title" content="Annual Feedback 2026 · Mayank Tutorials">
<meta property="og:description" content="Your voice makes your teachers &amp; staff better. 100% anonymous · 5 minutes · students &amp; parents only.">
<meta property="og:image" content="/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#ffffff">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Lora:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
<style>
:root{--sky:#0E8AC8;--navy:#203864;--navy-2:#2d4a80;--red:#DD152B;--ink:#16213a;--ink-2:#4a5672;--muted:#8a93a8;--line:#e3e7ef;--bg:#f4f6fa;--card:#fff;--soft:#eef2f9;--ok:#1a7f4b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Plus Jakarta Sans',system-ui,sans-serif;font-size:16px;line-height:1.45}
button{font:inherit;color:inherit;cursor:pointer}
.top{position:sticky;top:0;z-index:5;background:#fff;padding:10px 16px 0;box-shadow:0 2px 10px rgba(22,33,58,.06)}
.top .row{display:flex;align-items:center;justify-content:space-between;gap:12px;max-width:560px;margin:0 auto;padding-bottom:8px}
.top img{height:40px;width:auto;display:block;max-width:72vw;object-fit:contain;object-position:left}
.step-count{font-size:13px;font-weight:700;color:var(--navy);background:var(--soft);padding:4px 10px;border-radius:99px;white-space:nowrap}
.step-count:empty{display:none}
.bar{height:4px;background:#d6ecf8;margin:0 -16px;border-top:2px solid var(--sky)}
.bar i{display:block;height:100%;width:0;background:var(--red);transition:width .35s ease}
.hero{position:relative;overflow:hidden;background:linear-gradient(135deg,#203864 0%,#2a4a82 100%);color:#fff;border-radius:22px;padding:24px 20px 22px;margin-bottom:16px}
.hero::after{content:'';position:absolute;right:-30px;bottom:-30px;width:170px;height:170px;background:url(/emblem.jpg) center/contain no-repeat;opacity:.14;filter:invert(1) grayscale(1);mix-blend-mode:screen}
.hero .kicker{display:inline-block;font-size:12px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;background:var(--red);padding:5px 10px;border-radius:6px}
.hero h1{font-family:Lora,Georgia,serif;font-size:29px;margin:14px 0 8px;letter-spacing:0}
.hero h1 em{font-style:italic;color:#ffd5da}
.hero p{margin:0;color:#d7e0f1;max-width:420px}
.hero .live{margin-top:14px;font-size:13.5px;color:#fff;display:flex;align-items:center;gap:8px}
.hero .live i{width:8px;height:8px;border-radius:50%;background:#3ddc84;box-shadow:0 0 0 4px rgba(61,220,132,.25);animation:pulse 1.6s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 7px rgba(61,220,132,.05)}}
.brandfoot{text-align:center;color:var(--muted);font-size:12px;margin-top:22px}
.brandfoot b{font-family:Lora,Georgia,serif;color:var(--red);font-size:13px;letter-spacing:.5px}
.codebox{border:2px solid var(--navy)}
.codebox input{width:100%;font:inherit;font-size:24px;font-weight:800;letter-spacing:6px;text-transform:uppercase;text-align:center;border:1.5px solid var(--line);border-radius:12px;padding:12px;margin:10px 0 4px}
.codebox input:focus{outline:none;border-color:var(--navy)}
main{max-width:560px;margin:0 auto;padding:20px 16px 120px}
h1{font-size:26px;line-height:1.2;margin:8px 0 10px;letter-spacing:-.3px}
h2{font-size:21px;margin:4px 0 6px;letter-spacing:-.2px}
p.lead{color:var(--ink-2);margin:0 0 18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:14px;box-shadow:0 1px 2px rgba(22,33,58,.04)}
.pill{display:inline-block;background:var(--soft);color:var(--navy);font-weight:600;font-size:12.5px;padding:4px 10px;border-radius:99px;margin:0 6px 6px 0}
.pill.red{background:#fde8ea;color:var(--red)}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.choice{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:16px 14px;text-align:left;font-weight:600;min-height:58px;transition:border-color .15s,background .15s}
.choice:hover{border-color:var(--navy-2)}
.choice.on{border-color:var(--navy);background:var(--soft);box-shadow:inset 0 0 0 1px var(--navy)}
.choice small{display:block;font-weight:500;color:var(--muted);font-size:12.5px}
.choice.multi{display:flex;align-items:center;gap:10px}
.choice.multi .ck{width:22px;height:22px;border-radius:7px;border:2px solid #b9c3d6;flex:0 0 auto;display:grid;place-items:center;font-size:14px;color:#fff;transition:background .15s,border-color .15s}
.choice.multi.on .ck{background:var(--navy);border-color:var(--navy)}
.choice.multi.on .ck::after{content:'✓';font-weight:800}
.picknote{display:flex;gap:10px;align-items:flex-start;background:#fff7da;border:1px solid #f3e2a6;border-radius:14px;padding:12px 14px;margin-bottom:14px;font-size:14.5px}
.picknote span{font-size:20px;line-height:1.2}
.subjhd{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.subjhd b{font-size:16px}.subjhd small{color:var(--muted);font-weight:600;font-size:12.5px}
.q{padding:14px 0;border-top:1px solid var(--line)}
.q:first-of-type{border-top:0;padding-top:4px}
.q .t{font-weight:600;margin-bottom:10px}
.q .t .kw{color:#0b4f7a;font-weight:800;background:#dff0fb;border-radius:7px;padding:1px 7px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.scale button{--c:#203864;--bg:#eef2f9;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:8px 2px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;transition:transform .15s,border-color .15s,background .15s,box-shadow .15s}
.scale button[data-v="1"]{--c:#d93a3a;--bg:#fdeaea}
.scale button[data-v="2"]{--c:#e8772e;--bg:#fff0e4}
.scale button[data-v="3"]{--c:#c99a06;--bg:#fff7da}
.scale button[data-v="4"]{--c:#2f9e5b;--bg:#e6f6ec}
.scale button[data-v="5"]{--c:#13804a;--bg:#d9f2e3}
.scale button .e{font-size:26px;line-height:1.1;transition:transform .15s}
.scale button .n{font-weight:800;font-size:14px;color:var(--ink-2)}
.scale button .l{font-size:10.5px;color:var(--muted);font-weight:600;white-space:nowrap}
.scale button:hover{border-color:var(--c)}
.scale button.on{border-color:var(--c);background:var(--bg);box-shadow:0 0 0 1.5px var(--c) inset,0 4px 12px rgba(0,0,0,.08);transform:translateY(-2px)}
.scale button.on .e{transform:scale(1.22)}
.scale button.on .n,.scale button.on .l{color:var(--c)}
.scale button.on .l{font-weight:800}
.scale:has(.on) button:not(.on) .e{opacity:.55}
.scale button:active{transform:scale(.96)}
textarea{width:100%;min-height:84px;border:1.5px solid var(--line);border-radius:12px;padding:12px;font:inherit;resize:vertical;background:#fff}
textarea:focus{outline:none;border-color:var(--navy)}
textarea.err{border-color:var(--red);background:#fff8f8}
.hint{font-size:12.5px;color:var(--muted);margin-top:6px}
.err-msg{color:var(--red);font-size:13.5px;font-weight:600;margin-top:6px}
.foot{position:fixed;left:0;right:0;bottom:0;background:linear-gradient(transparent,var(--bg) 30%);padding:18px 16px calc(14px + env(safe-area-inset-bottom))}
.foot .in{max-width:560px;margin:0 auto;display:flex;gap:10px}
.btn{flex:1;border:0;border-radius:14px;padding:15px 18px;font-weight:700;font-size:16px;background:var(--navy);color:#fff;box-shadow:0 6px 16px rgba(32,56,100,.25)}
.btn:disabled{opacity:.45;box-shadow:none}
.btn.ghost{flex:0 0 auto;background:#fff;color:var(--navy);border:1.5px solid var(--line);box-shadow:none}
.btn.red{background:var(--red);box-shadow:0 6px 16px rgba(221,21,43,.25)}
.skip{display:block;margin:6px auto 0;background:none;border:0;color:var(--ink-2);font-size:14px;text-decoration:underline;text-underline-offset:3px}
.who{display:flex;align-items:center;gap:14px;margin-bottom:10px}
.avatar{width:54px;height:54px;border-radius:16px;background:var(--navy);color:#fff;font-weight:800;display:grid;place-items:center;font-size:20px;flex:0 0 auto}
.avatar.staff{background:var(--red)}
.who .meta{color:var(--ink-2);font-size:13.5px}
.list-row{display:flex;align-items:center;gap:12px;padding:12px 4px;border-top:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
.list-row:first-child{border-top:0}
.status{margin-left:auto;font-size:13px;font-weight:700;white-space:nowrap}
.status.done{color:var(--ok)}.status.part{color:#b26a00}.status.skip{color:var(--muted)}.status.bad{color:var(--red)}
.dot{width:10px;height:10px;border-radius:50%;flex:0 0 auto}
.trust{display:flex;gap:10px;align-items:flex-start;font-size:14px;color:var(--ink-2);margin:10px 0}
.trust span{font-size:20px;line-height:1}
.center{text-align:center}
.big-emoji{font-size:64px;line-height:1;margin:30px 0 8px}
.fade{animation:fade .28s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.loading{color:var(--muted);text-align:center;padding:40px 0}
.toast{position:fixed;left:50%;top:76px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:20;max-width:90vw;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
@media (max-width:380px){.scale button .l{font-size:9.5px}.choices{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="top"><div class="row"><img src="/logo.jpg" alt="Mayank Tutorials: A Brand You Can Trust" width="1000" height="137"><div class="step-count" id="count"></div></div><div class="bar"><i id="bar"></i></div></header>
<main id="app"><div class="loading">Loading…</div></main>
<div class="foot" id="foot" hidden><div class="in"><button class="btn ghost" id="back" aria-label="Back">←</button><button class="btn" id="next">Next</button></div></div>
<div class="toast" id="toast"></div>
<script>
const SCALE=[['😞','Poor'],['🙁','Fair'],['😐','Good'],['🙂','Very good'],['🤩','Excellent']];
const OVERALL=['How likely are you to *recommend* Mayank Tutorials to your friends or family?','How much have your *marks or understanding improved* since joining Mayank Tutorials?','How satisfied are you with our *communication, punctuality, and support*?'];
const TQ=(n,s)=>[`How *clearly* does ${n} explain ${s}?`,`How effectively does ${n} *solve your doubts* in ${s}?`,`How *approachable and supportive* is ${n}?`,`How *knowledgeable* is ${n} about the subject?`,`How *punctual and professional* is ${n}'s class?`];
const SQ=n=>[`How *helpful* was ${n}?`,`Did ${n} *go beyond expectations* to assist you?`,`How *clear and timely* was ${n}'s communication?`,`How *timely* was ${n} in handling *test papers, timetables*, etc.?`,`How effectively did ${n} *resolve your issues*?`];
const KEY='pulse-draft-v1';
const $=s=>document.querySelector(s), app=$('#app');
const kw=q=>esc(q).replace(/\*(.+?)\*/g,'<span class="kw">$1</span>');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const initials=n=>n.replace(/\b(sir|mam|maam|madam|miss|mr|mrs|ms)\b/ig,'').trim().split(/\s+/).map(w=>w[0]).join('').slice(0,2).toUpperCase()||'•';
let cfg=null, roster=null, S=load()||fresh();
function fresh(){return{step:'welcome',centre:null,batch:null,overall:{r:[null,null,null],comment:''},picks:{},ratings:{},skipped:{},errors:{}}}
function load(){try{return JSON.parse(localStorage.getItem(KEY))}catch{return null}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch{}}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2600)}
async function api(path,opt){const r=await fetch(path,opt);const d=await r.json().catch(()=>({}));if(!r.ok&&r.status!==422)throw new Error(d.error||'Network problem, please try again.');return{status:r.status,...d}}

// ---------- roster logic ----------
function subjectsGroups(){ // subject -> [teacher]
  const g=new Map();
  for(const a of roster.assignments.filter(a=>a.role==='teacher')){const s=a.subject||'Other';if(!g.has(s))g.set(s,[]);if(!g.get(s).includes(a.person))g.get(s).push(a.person)}
  return g;
}
function needsPick(){return[...subjectsGroups()].filter(([s,t])=>t.length>1)}
function cards(){
  const out=[], seen=new Map(), g=subjectsGroups();
  for(const [s,ts] of g){
    const chosen=ts.length>1?(S.picks[s]||[]):ts;
    for(const t of chosen){if(seen.has(t)){seen.get(t).subjects.push(s);continue}const c={key:'teacher|'+t,role:'teacher',person:t,subjects:[s]};seen.set(t,c);out.push(c)}
  }
  const staff=[...new Set(roster.assignments.filter(a=>a.role==='staff').map(a=>a.person))];
  for(const p of staff)out.push({key:'staff|'+p,role:'staff',person:p});
  return out;
}
function steps(){
  const st=['welcome',...(cfg&&cfg.centres&&cfg.centres.length===1?[]:['centre']),'batch'];
  if(!roster)return st;
  st.push('overall');
  if(needsPick().length)st.push('pick');
  st.push(...cards().map(c=>'card:'+c.key),'review');
  return st;
}
const answeredCount=r=>r?r.r.filter(v=>v).length:0;

// ---------- render ----------
function setFoot(nextLabel,{disabled=false,back=true,red=false,hide=false}={}){
  $('#foot').hidden=hide; $('#next').textContent=nextLabel; $('#next').disabled=disabled; $('#back').style.display=back?'':'none'; $('#next').classList.toggle('red',red);
}
function progress(){
  const st=steps(), i=st.indexOf(S.step);
  const total=st.length-1; const pct=S.step==='done'?100:Math.max(0,Math.round(i/total*100));
  $('#bar').style.width=pct+'%';
  const cs=st.filter(x=>x.startsWith('card:')); const ci=cs.indexOf(S.step);
  $('#count').textContent=ci>=0?`${ci+1} of ${cs.length}`:'';
}
function scaleHTML(id,val){
  return `<div class="scale" role="radiogroup">${SCALE.map(([e,l],i)=>`<button type="button" role="radio" aria-checked="${val===i+1}" data-q="${id}" data-v="${i+1}" class="${val===i+1?'on':''}"><span class="e">${e}</span><span class="n">${i+1}</span><span class="l">${l}</span></button>`).join('')}</div>`;
}
function render(){
  progress(); window.scrollTo({top:0});
  const step=S.step; let h='';
  if(step==='welcome'){
    const done=localStorage.getItem('pulse-done');
    h=`<div class="fade"><div class="hero"><span class="kicker">Annual Feedback ${new Date().getFullYear()}</span>
      <h1>Your voice makes your <em>teachers & staff</em> better.</h1>
      <p>About 5 minutes. Students and parents are both welcome. Rate only the teachers and staff you know, and skip any question you like.</p></div>
      <div class="card">
        <div class="trust"><span>🕶️</span><div><b>Completely anonymous.</b> We never ask your name, phone number or roll number.</div></div>
        <div class="trust"><span>🎯</span><div><b>Short and personal.</b> You'll only see the teachers and staff of your own batch.</div></div>
        <div class="trust"><span>💬</span><div><b>Be honest, be kind.</b> Criticism is welcome, and it is what helps teachers improve. Abusive words are not accepted.</div></div>
      </div>
      ${done?`<div class="card"><b>You've already sent feedback from this phone.</b><div class="hint">If you're a parent with another child, or a sibling is using this phone, you can fill it again.</div></div>`:''}
      ${cfg.open&&cfg.gated&&!CODE_OK?`<div class="card codebox"><b>🔑 Enter your centre code</b><div class="hint" style="margin-top:2px">Your centre has shared it in your batch WhatsApp group. Everyone at your centre uses the same code, so it can't identify you.</div><input id="code" maxlength="10" autocomplete="off" autocapitalize="characters" placeholder="e.g. CN1234" value="${esc(CODE||'')}">${CODE_ERR?`<div class="err-msg">${esc(CODE_ERR)}</div>`:''}</div>`:''}
      ${!cfg.open?`<div class="card"><b>Feedback is closed right now.</b></div>`:''}${FOOT}</div>`;
    app.innerHTML=h; setFoot(S.centre&&CODE_OK?'Continue':'Start',{back:false,disabled:!cfg.open});
    const ci=$('#code'); if(ci){ci.addEventListener('keydown',e=>{if(e.key==='Enter')go()});} return;
  }
  if(step==='centre'){
    h=`<div class="fade"><h2>Which centre?</h2><p class="lead">Choose the branch where you attend classes.</p><div class="choices">${cfg.centres.map(c=>`<button class="choice ${S.centre===c.name?'on':''}" data-centre="${esc(c.name)}">${esc(c.name)}</button>`).join('')}</div></div>`;
    app.innerHTML=h; setFoot('Next',{disabled:!S.centre}); return;
  }
  if(step==='batch'){
    if(!S.centre&&cfg.centres.length===1)S.centre=cfg.centres[0].name;
    const c=cfg.centres.find(c=>c.name===S.centre);
    if(!c){S.step='welcome';return render()}
    h=`<div class="fade"><span class="pill">${esc(S.centre)}</span><h2>Which batch?</h2><p class="lead">Choose your standard and board or stream.</p><div class="choices">${c.batches.map(b=>`<button class="choice ${S.batch===b?'on':''}" data-batch="${esc(b)}">${esc(b)}</button>`).join('')}</div></div>`;
    app.innerHTML=h; setFoot('Next',{disabled:!S.batch}); return;
  }
  if(step==='pick'){
    const groups=needsPick();
    h=`<div class="fade"><span class="pill">${esc(S.centre)} · ${esc(S.batch)}</span><h2>Which teachers teach you?</h2><p class="lead">These subjects have more than one teacher in your batch. Pick only the teachers who <b>actually teach you</b>. You'll rate just them next.</p>
      <div class="picknote"><span>☑️</span><div><b>You can tick more than one</b> if two teachers take the subject for you (e.g. Physics part 1 and part 2). If none of them teach you, leave it blank.</div></div>
      ${groups.map(([s,ts])=>{const n=(S.picks[s]||[]).length;return`<div class="card"><div class="subjhd"><b>${esc(s)}</b><small data-cnt="${esc(s)}">${n?n+' selected':'Tick all that apply'}</small></div><div class="choices">${ts.map(t=>`<button class="choice multi ${(S.picks[s]||[]).includes(t)?'on':''}" role="checkbox" aria-checked="${(S.picks[s]||[]).includes(t)}" data-pick-s="${esc(s)}" data-pick-t="${esc(t)}"><span class="ck"></span>${esc(t)}</button>`).join('')}</div></div>`}).join('')}</div>`;
    app.innerHTML=h; setFoot('Next'); return;
  }
  if(step==='overall'){
    const o=S.overall;
    h=`<div class="fade"><span class="pill">${esc(S.centre)} · ${esc(S.batch)}</span><h2>About Mayank Tutorials</h2><p class="lead">First, a few questions about your overall experience.</p>
      <div class="card">${OVERALL.map((q,i)=>`<div class="q"><div class="t">${kw(q)}</div>${scaleHTML('o'+i,o.r[i])}</div>`).join('')}
      <div class="q"><div class="t">Any brief comments about your overall experience?</div><textarea data-c="overall" class="${S.errors.overall?'err':''}" placeholder="Optional. What do you like? What should we improve?">${esc(o.comment)}</textarea>${S.errors.overall?`<div class="err-msg">${esc(S.errors.overall)}</div>`:''}</div></div></div>`;
    app.innerHTML=h; setFoot('Next'); focusErr(); return;
  }
  if(step.startsWith('card:')){
    const key=step.slice(5), c=cards().find(c=>c.key===key);
    if(!c){S.step='review';return render()}
    const r=S.ratings[key]||(S.ratings[key]={r:[null,null,null,null,null],comment:''});
    const subj=c.subjects?c.subjects.join(' & '):'';
    const qs=c.role==='teacher'?TQ(c.person,subj):SQ(c.person);
    h=`<div class="fade"><div class="card"><div class="who"><div class="avatar ${c.role}">${esc(initials(c.person))}</div><div><h2 style="margin:0">${esc(c.person)}</h2><div class="meta">${c.role==='teacher'?'Teacher · '+esc(subj):'Office & support staff'}</div></div></div>
      ${qs.map((q,i)=>`<div class="q"><div class="t">${kw(q)}</div>${scaleHTML('r'+i,r.r[i])}</div>`).join('')}
      <div class="q"><div class="t">Any comments about ${esc(c.person)}?</div><textarea data-c="${esc(key)}" class="${S.errors[key]?'err':''}" placeholder="${c.role==='teacher'?'Optional. One thing to keep doing, one thing to improve…':'Optional. How did they help? What could be better?'}">${esc(r.comment)}</textarea>${S.errors[key]?`<div class="err-msg">${esc(S.errors[key])}</div>`:'<div class="hint">English, Hindi or Marathi is fine.</div>'}</div></div>
      <button class="skip" data-skip="${esc(key)}">I don't know ${esc(c.person)}, skip</button></div>`;
    app.innerHTML=h; setFoot('Next'); focusErr(); return;
  }
  if(step==='review'){
    const cs=cards(); let full=0;
    const rows=cs.map(c=>{const r=S.ratings[c.key];const n=answeredCount(r);let st,cl;
      if(S.errors[c.key]){st='Fix comment';cl='bad'}else if(S.skipped[c.key]&&!n){st='Skipped';cl='skip'}else if(n===5){st='✓ Done';cl='done';full++}else if(n){st=n+'/5';cl='part'}else{st='Not rated';cl='skip'}
      return`<button class="list-row" data-goto="card:${esc(c.key)}"><div class="avatar ${c.role}" style="width:38px;height:38px;border-radius:11px;font-size:14px">${esc(initials(c.person))}</div><div><b>${esc(c.person)}</b><div class="hint" style="margin:0">${c.role==='teacher'?esc(c.subjects.join(', ')):'Staff'}</div></div><span class="status ${cl}">${st}</span></button>`}).join('');
    const on=answeredCount(S.overall);
    const left=cs.filter(c=>!S.skipped[c.key]&&answeredCount(S.ratings[c.key])<5).length;
    h=`<div class="fade"><h2>Almost done 🎉</h2><p class="lead">${left?`${left} ${left===1?'person is':'people are'} not fully rated yet. Tap a name to finish, or submit as it is.`:'Everything is rated. Thank you for being thorough!'}</p>
      <div class="card"><button class="list-row" data-goto="overall"><div class="avatar" style="width:38px;height:38px;border-radius:11px;font-size:14px;background:#6b7a99">MT</div><div><b>Overall experience</b></div><span class="status ${S.errors.overall?'bad':on===3?'done':on?'part':'skip'}">${S.errors.overall?'Fix comment':on===3?'✓ Done':on+'/3'}</span></button></div>
      <div class="card">${rows}</div>
      <div class="hp"><label>Website <input id="website" tabindex="-1" autocomplete="off"></label></div></div>`;
    app.innerHTML=h; setFoot('Submit feedback',{red:true}); return;
  }
  if(step==='done'){
    const DI=S.doneInfo||{};
    h=`<div class="fade"><div class="hero center"><div style="font-size:54px;line-height:1">🙏</div><h1>Thank you!</h1><p style="margin:0 auto">Your feedback has gone in anonymously.${DI.people?` You just helped <b style="color:#fff">${DI.people} teachers &amp; staff</b> get better.`:''}</p></div>
      ${DI.ref?`<p class="hint center" style="margin-top:4px">Reference no. ${esc(DI.ref)}</p>`:''}${FOOT}</div>`;
    app.innerHTML=h; setFoot('',{hide:true});
  }
}

function focusErr(){const t=app.querySelector('textarea.err');if(t)setTimeout(()=>{t.scrollIntoView({behavior:'smooth',block:'center'});t.focus({preventScroll:true})},150)}
// ---------- events ----------
app.addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b)return;
  if(b.dataset.centre){if(S.centre!==b.dataset.centre){S.centre=b.dataset.centre;S.batch=null;roster=null;S.picks={};S.ratings={};S.skipped={}}save();render();setTimeout(go,160);return}
  if(b.dataset.batch){if(S.batch!==b.dataset.batch){S.batch=b.dataset.batch;roster=null;S.picks={};S.ratings={};S.skipped={}}save();render();setTimeout(go,160);return}
  if(b.dataset.pickS){const s=b.dataset.pickS,t=b.dataset.pickT,a=S.picks[s]||(S.picks[s]=[]);const i=a.indexOf(t);i>=0?a.splice(i,1):a.push(t);b.classList.toggle('on');b.setAttribute('aria-checked',b.classList.contains('on'));
    const c=[...app.querySelectorAll('[data-cnt]')].find(x=>x.dataset.cnt===s);if(c)c.textContent=a.length?a.length+' selected':'Tick all that apply';save();return}
  if(b.dataset.q){
    const v=+b.dataset.v, q=b.dataset.q;
    if(q[0]==='o'){const i=+q.slice(1);S.overall.r[i]=S.overall.r[i]===v?null:v}
    else{const key=S.step.slice(5),i=+q.slice(1);const r=S.ratings[key];r.r[i]=r.r[i]===v?null:v;delete S.skipped[key]}
    b.parentElement.querySelectorAll('button').forEach(x=>{const on=x===b&&(q[0]==='o'?S.overall.r[+q.slice(1)]:S.ratings[S.step.slice(5)].r[+q.slice(1)])===v;x.classList.toggle('on',on);x.setAttribute('aria-checked',on)});
    save();
    // gentle auto-scroll to the next question
    const qd=b.closest('.q'), nx=qd&&qd.nextElementSibling; if(nx&&nx.classList.contains('q')){const y=nx.getBoundingClientRect().top+window.scrollY-110;if(nx.getBoundingClientRect().top>window.innerHeight*.55)window.scrollTo({top:y,behavior:'smooth'})}
    return;
  }
  if(b.dataset.skip){S.skipped[b.dataset.skip]=true;const r=S.ratings[b.dataset.skip];if(r){r.r=[null,null,null,null,null]}save();go();return}
  if(b.dataset.goto){S.step=b.dataset.goto;save();render();return}
});
app.addEventListener('input',e=>{
  const t=e.target; if(!t.dataset.c)return;
  if(t.dataset.c==='overall')S.overall.comment=t.value;else S.ratings[t.dataset.c].comment=t.value;
  if(S.errors[t.dataset.c]){delete S.errors[t.dataset.c];t.classList.remove('err');const m=t.parentElement.querySelector('.err-msg');if(m)m.remove()}
  save();
});
$('#back').onclick=()=>{const st=steps();const i=st.indexOf(S.step);if(i>0){S.step=st[i-1];save();render()}};
$('#next').onclick=go;
async function go(){
  if(S.step==='welcome'&&cfg.gated&&!CODE_OK){
    const v=(($('#code')||{}).value||'').trim().toUpperCase().replace(/[^A-Z0-9]/g,'');
    if(!v){CODE_ERR='Please enter your centre code.';return render()}
    CODE=v; $('#next').disabled=true;
    try{await loadCfg()}catch(e){CODE_ERR=e.message}
    if(!CODE_OK)return render();
  }
  const st=steps(); let i=st.indexOf(S.step);
  if(S.step==='batch'){await loadRoster();if(!roster)return}
  if(S.step==='review')return submit();
  const nst=steps(); i=nst.indexOf(S.step);
  // from a card fixed after a blocked submit, jump back to review
  if(S.step.startsWith('card:')||S.step==='overall'){if(S._fixing){S._fixing=false;S.step='review';save();return render()}}
  S.step=nst[Math.min(i+1,nst.length-1)]; save(); render();
}
async function loadRoster(){
  $('#next').disabled=true;
  try{roster=await api(withCode('/api/config?centre='+encodeURIComponent(S.centre)+'&batch='+encodeURIComponent(S.batch)))}catch(e){toast(e.message);roster=null}
  $('#next').disabled=false;
}
async function submit(){
  const btn=$('#next'); btn.disabled=true; btn.textContent='Sending…';
  const cs=cards();
  const ratings=cs.filter(c=>S.ratings[c.key]&&(answeredCount(S.ratings[c.key])||S.ratings[c.key].comment.trim())).map(c=>({role:c.role,person:c.person,r:S.ratings[c.key].r,comment:S.ratings[c.key].comment}));
  try{
    const d=await api('/api/submit',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({code:CODE,centre:S.centre,batch:S.batch,overall:{q1:S.overall.r[0],q2:S.overall.r[1],q3:S.overall.r[2],comment:S.overall.comment},ratings,website:($('#website')||{}).value||''})});
    if(d.status===422){
      S.errors={};
      for(const b of d.blocked){const k=b.index<0?'overall':ratings[b.index]&&(ratings[b.index].role+'|'+ratings[b.index].person);if(k)S.errors[k]=b.reason}
      const first=Object.keys(S.errors)[0];
      S.step=first==='overall'?'overall':'card:'+first; S._fixing=true; save(); render();
      toast('One comment needs a small change before sending.'); return;
    }
    try{localStorage.setItem('pulse-done',Date.now());localStorage.removeItem(KEY)}catch{}
    const info={ref:d.ref,centre:S.centre,batch:S.batch,people:ratings.filter(r=>r.r.some(v=>v)).length};
    S=fresh(); S.step='done'; S.doneInfo=info; render();
  }catch(e){toast(e.message);btn.disabled=false;btn.textContent='Submit feedback'}
}
const FOOT=`<div class="brandfoot"><b>MAYANK TUTORIALS</b><br>A Brand You Can Trust · Since 2013</div>`;
let CODE=null, CODE_OK=false, CODE_ERR='';
try{const u=new URL(location.href);CODE=(u.searchParams.get('c')||new URLSearchParams(location.hash.slice(1)).get('c')||localStorage.getItem('pulse-code')||'').toUpperCase()||null;if(u.searchParams.get('c')||location.hash.includes('c='))history.replaceState(null,'',location.pathname)}catch{}
const withCode=p=>p+(p.includes('?')?'&':'?')+'code='+encodeURIComponent(CODE||'');
async function loadCfg(){
  cfg=await api(withCode('/api/config'));
  CODE_OK=!cfg.gated||cfg.valid;
  if(cfg.gated&&CODE&&!cfg.valid){CODE_ERR='That code didn\'t work. Check the message from your centre.';}
  if(CODE_OK){CODE_ERR='';try{if(CODE)localStorage.setItem('pulse-code',CODE)}catch{}
    if(cfg.centres.length===1&&S.centre!==cfg.centres[0].name){S.centre=cfg.centres[0].name;S.batch=null;roster=null}
    if(S.centre&&!cfg.centres.some(c=>c.name===S.centre)){S.centre=null;S.batch=null;roster=null}}
}
(async()=>{
  try{await loadCfg()}catch(e){app.innerHTML=`<div class="loading">${esc(e.message||'Could not load. Please check your internet and refresh.')}</div>`;return}
  if(S.centre&&S.batch&&!['welcome','centre','batch','done'].includes(S.step)){await loadRoster();if(!roster)S.step='batch'}
  if(S.step==='done')S=fresh();
  render();
})();
</script>
</body>
